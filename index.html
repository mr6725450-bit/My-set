<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ذكاء الطالب - النظام المحاسبي المتكامل</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 12px;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 24px;
            color: var(--primary-color);
            margin: 10px 0 5px;
        }

        .header p {
            font-size: 13px;
            color: #7f8c8d;
            margin: 0;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .btn-logout {
            background-color: #e74c3c;
            margin-top: 20px;
        }

        .btn-logout:hover {
            background-color: #c0392b;
        }

        .menu-list {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }

        .menu-list li {
            margin-bottom: 12px;
        }

        .menu-list a {
            display: flex;
            align-items: center;
            padding: 14px 15px;
            background-color: #f1f4f6;
            color: var(--primary-color);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.3s, transform 0.2s;
        }

        .menu-list a:hover {
            background-color: #e2e8f0;
            transform: translateX(-3px);
        }

        .menu-list span {
            margin-left: 12px;
            font-size: 18px;
        }

        /* التحكم في إظهار وإخفاء الواجهات */
        .hidden {
            display: none;
        }

        .welcome-banner {
            background: #e8f8f5;
            border-right: 4px solid var(--success-color);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #16a085;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- واجهة تسجيل الدخول (الواجهة الأولى) -->
        <div id="loginSection">
            <div class="header">
                <h1>🎓 ذكاء الطالب</h1>
                <p>تصميم وحقوق الملكية: علي عمر علي باشحبل</p>
            </div>

            <div class="form-group">
                <label for="username">اسم الطالب</label>
                <input type="text" id="username" value="علي عمر" placeholder="أدخل اسم الطالب">
            </div>

            <div class="form-group">
                <label for="password">كلمة السر</label>
                <input type="password" id="password" value="123456" placeholder="أدخل كلمة السر">
            </div>

            <button class="btn" onclick="loginSystem()">دخول للنظام</button>
        </div>

        <!-- واجهة لوحة التحكم الرئيسية للطالب (الواجهة الثانية) -->
        <div id="dashboardSection" class="hidden">
            <div class="header">
                <h1>📊 لوحة تحكم الطالب الذكي</h1>
                <p>النظام المحاسبي المتكامل</p>
            </div>

            <div class="welcome-banner" id="welcomeMsg">
                مرحباً بك، علي عمر
            </div>

            <ul class="menu-list">
                <li><a href="#" onclick="alert('فتح قسم: دفتر اليومية')"><span>📖</span> دفتر اليومية</a></li>
                <li><a href="#" onclick="alert('فتح قسم: دفتر الأستاذ')"><span>📘</span> دفتر الأستاذ</a></li>
                <li><a href="#" onclick="alert('فتح قسم: ميزان المراجعة')"><span>⚖️</span> ميزان المراجعة</a></li>
                <li><a href="#" onclick="alert('فتح قسم: حساب المتاجرة')"><span>🏪</span> حساب المتاجرة</a></li>
                <li><a href="#" onclick="alert('فتح قسم: قائمة الدخل')"><span>📈</span> قائمة الدخل</a></li>
            </ul>

            <button class="btn btn-logout" onclick="logoutSystem()">تسجيل الخروج</button>
            
            <div style="text-align: center; margin-top: 15px; font-size: 11px; color: #95a5a6;">
                جميع الحقوق محفوظة © علي عمر علي باشحبل
            </div>
        </div>

    </div>

    <script>
        function loginSystem() {
            const nameInput = document.getElementById('username').value;
            if(nameInput.trim() === "") {
                alert("الرجاء إدخال اسم الطالب");
                return;
            }
            
            // تحديث رسالة الترحيب باسم الطالب المسجل
            document.getElementById('welcomeMsg').innerText = "مرحباً بك، " + nameInput;
            
            // إخفاء واجهة الدخول وإظهار واجهة لوحة التحكم
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
        }

        function logoutSystem() {
            // العودة لواجهة تسجيل الدخول
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }
    </script>

</body>
</html>
