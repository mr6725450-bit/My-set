<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ذكاء الطالب - النظام المحاسبي</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 24px;
            color: var(--primary-color);
            margin: 10px 0 5px;
        }

        .header p {
            font-size: 14px;
            color: #666;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: #2980b9;
        }

        .menu-list {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        .menu-list li {
            margin-bottom: 12px;
        }

        .menu-list a {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background-color: #f1f4f6;
            color: var(--primary-color);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.3s, transform 0.2s;
        }

        .menu-list a:hover {
            background-color: #e2e8f0;
            transform: translateX(-3px);
        }

        .menu-list span {
            margin-left: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- رأس الصفحة -->
        <div class="header">
            <h1>🎓 ذكاء الطالب</h1>
            <p>تصميم: علي عمر علي باشحبل</p>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <div class="form-group">
            <label for="username">اسم الطالب</label>
            <input type="text" id="username" value="علي عمر" readonly>
        </div>

        <div class="form-group">
            <label for="password">كلمة السر</label>
            <input type="password" id="password" value="••••••" readonly>
        </div>

        <button class="btn-submit">دخول للنظام</button>

        <!-- القوائم وأقسام النظام المحاسبي -->
        <ul class="menu-list" style="margin-top: 30px;">
            <li><a href="#"><span>📊</span> دفتر اليومية</a></li>
            <li><a href="#"><span>📘</span> دفتر الأستاذ</a></li>
            <li><a href="#"><span>⚖️</span> ميزان المراجعة</a></li>
            <li><a href="#"><span>🏪</span> حساب المتاجرة</a></li>
            <li><a href="#"><span>📈</span> قائمة الدخل</a></li>
        </ul>
    </div>

</body>
</html>
